<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1f1e1d;
    color: #f0eee6;
    font-family: system-ui, sans-serif;
  }
  #bar {
    display: flex;
    justify-content: space-between;
    width: 406px;
    font-size: 24px;
    margin-bottom: 12px;
  }
  #wrap { position: relative; }
  canvas { background: #2b2a28; border: 3px solid #d97757; border-radius: 6px; display: block; }
  #gameover {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  #gameover h1 { font-size: 48px; margin: 0 0 12px; color: #d97757; }
  #gameover p { margin: 6px 0; font-size: 18px; }
  #skins { display: flex; gap: 10px; margin: 4px 0 12px; }
  .skin {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: 3px solid transparent;
    cursor: pointer;
    padding: 0;
  }
  .skin.selected { border-color: #fff; box-shadow: 0 0 8px #fff; }
  #hint { margin-top: 12px; color: #9a978f; font-size: 14px; }
</style>
</head>
<body>
  <div id="bar">
    <div id="best">Best: 0</div>
    <div id="score">Score: 0</div>
  </div>
  <div id="wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="gameover">
      <h1>GAME OVER</h1>
      <p id="final">Score: 0</p>
      <p>Snake skin:</p>
      <div id="skins"></div>
      <p>Press Space or Enter to play again</p>
    </div>
  </div>
  <div id="hint">Controls: W — up, S — down, A — left, D — right</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overEl = document.getElementById('gameover');
const finalEl = document.getElementById('final');

const CELL = 20;
const COLS = canvas.width / CELL;
const ROWS = canvas.height / CELL;
const BASE_SPEED = 150;  // ms per step at the start
const SPEED_STEP = 8;    // ms faster every 10 points
const MIN_SPEED = 60;
const SMOOTH = 1;     // share of a step spent sliding between cells (less = snappier)
const SKINS = [
  { name: 'Green',  head: '#8fd18f', body: '#5aa65a' },
  { name: 'Blue',   head: '#7fb8ff', body: '#4a86d4' },
  { name: 'Purple', head: '#c9a0ff', body: '#9566d6' },
  { name: 'Pink',   head: '#ff9ec8', body: '#d9669a' },
  { name: 'Yellow', head: '#ffe27a', body: '#d9b83a' },
  { name: 'White',  head: '#ffffff', body: '#bdbdbd' },
];
let skinIndex = 0;
try { skinIndex = parseInt(localStorage.getItem('snakeSkin'), 10) || 0; } catch (e) {}
if (skinIndex < 0 || skinIndex >= SKINS.length) skinIndex = 0;

function currentSpeed() {
  return Math.max(MIN_SPEED, BASE_SPEED - Math.floor(score / 10) * SPEED_STEP);
}

let snake, prevSnake, dir, inputQueue, food, score, alive;
let acc = 0, lastTime = 0;
let best = 0;
try { best = parseInt(localStorage.getItem('snakeBest'), 10) || 0; } catch (e) {}
bestEl.textContent = 'Best: ' + best;

function start() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  prevSnake = snake.map(s => ({ ...s }));
  dir = { x: 1, y: 0 };
  inputQueue = [];
  score = 0;
  alive = true;
  acc = 0;
  scoreEl.textContent = 'Score: 0';
  overEl.style.display = 'none';
  placeFood();
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function step() {
  if (inputQueue.length) dir = inputQueue.shift();
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
  const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
  if (hitWall || hitSelf) return gameOver();

  prevSnake = snake.map(s => ({ ...s }));
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = 'Score: ' + score;
    if (score > best) {
      best = score;
      bestEl.textContent = 'Best: ' + best;
      try { localStorage.setItem('snakeBest', best); } catch (e) {}
    }
    placeFood();
  } else {
    snake.pop();
  }
}

function gameOver() {
  alive = false;
  prevSnake = snake.map(s => ({ ...s }));
  finalEl.textContent = 'Score: ' + score;
  overEl.style.display = 'flex';
}

// Claude icon: an orange "spark" made of rays
function drawClaude(cx, cy, r) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = '#d97757';
  ctx.lineCap = 'round';
  ctx.lineWidth = 2;
  const rays = 12;
  for (let i = 0; i < rays; i++) {
    const a = (Math.PI * 2 * i) / rays;
    const len = i % 2 === 0 ? r : r * 0.7;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.15, Math.sin(a) * r * 0.15);
    ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
    ctx.stroke();
  }
  ctx.restore();
}

// t in [0..1] — progress between the previous and the current step
function draw(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawClaude(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 1);

  snake.forEach((s, i) => {
    const p = prevSnake[Math.min(i, prevSnake.length - 1)];
    const x = p.x + (s.x - p.x) * t;
    const y = p.y + (s.y - p.y) * t;
    ctx.fillStyle = i === 0 ? SKINS[skinIndex].head : SKINS[skinIndex].body;
    ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
  });
}

function frame(time) {
  const dt = Math.min(time - (lastTime || time), 100);
  lastTime = time;
  if (alive) {
    acc += dt;
    const interval = currentSpeed();
    while (alive && acc >= interval) {
      acc -= interval;
      step();
    }
  }
  draw(alive ? Math.min(acc / (currentSpeed() * SMOOTH), 1) : 1);
  requestAnimationFrame(frame);
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!alive) {
    if (k === ' ' || k === 'enter') start();
    return;
  }
  // Russian layout is supported too: ц ы ф в = w s a d
  const map = {
    w: { x: 0, y: -1 }, 'ц': { x: 0, y: -1 },
    s: { x: 0, y: 1 },  'ы': { x: 0, y: 1 },
    a: { x: -1, y: 0 }, 'ф': { x: -1, y: 0 },
    d: { x: 1, y: 0 },  'в': { x: 1, y: 0 },
  };
  const d = map[k];
  if (!d) return;
  // queue turns so quick presses are not lost; check against the last queued direction
  const last = inputQueue.length ? inputQueue[inputQueue.length - 1] : dir;
  const same = d.x === last.x && d.y === last.y;
  const reverse = d.x === -last.x && d.y === -last.y; // no 180° turns
  if (same || reverse || inputQueue.length >= 3) return;
  inputQueue.push(d);
  // the snake has already finished sliding into its cell: turn right now instead of waiting for the next tick
  if (inputQueue.length === 1 && acc >= currentSpeed() * SMOOTH) {
    acc = 0;
    step();
  }
});

// skin picker on the GAME OVER screen
const skinsEl = document.getElementById('skins');
SKINS.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'skin';
  b.title = s.name;
  b.style.background = `linear-gradient(135deg, ${s.head} 50%, ${s.body} 50%)`;
  b.addEventListener('click', () => {
    skinIndex = i;
    try { localStorage.setItem('snakeSkin', i); } catch (e) {}
    renderSkins();
  });
  skinsEl.appendChild(b);
});
function renderSkins() {
  [...skinsEl.children].forEach((b, i) => b.classList.toggle('selected', i === skinIndex));
}
renderSkins();

start();
requestAnimationFrame(frame);
</script>
</body>
</html>
