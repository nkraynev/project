<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1f1e1d;
    color: #f0eee6;
    font-family: system-ui, sans-serif;
  }
  #bar {
    display: flex;
    justify-content: space-between;
    width: 406px;
    font-size: 24px;
    margin-bottom: 12px;
  }
  #wrap { position: relative; }
  canvas { background: #2b2a28; border: 3px solid #d97757; border-radius: 6px; display: block; }
  #gameover {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  #gameover h1 { font-size: 48px; margin: 0 0 12px; color: #d97757; }
  #gameover p { margin: 6px 0; font-size: 18px; }
  #skins { display: flex; gap: 10px; margin: 4px 0 12px; }
  .skin {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    border: 3px solid transparent;
    cursor: pointer;
    padding: 0;
  }
  .skin.selected { border-color: #fff; box-shadow: 0 0 8px #fff; }
  #hint { margin-top: 12px; color: #9a978f; font-size: 14px; }
</style>
</head>
<body>
  <div id="bar">
    <div id="best">Best: 0</div>
    <div id="score">Score: 0</div>
  </div>
  <div id="wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="gameover">
      <h1 id="title">GAME OVER</h1>
      <p id="final">Score: 0</p>
      <p>Snake skin:</p>
      <div id="skins"></div>
      <p>Press Space or Enter to play again</p>
    </div>
  </div>
  <div id="hint">Controls: W — up, S — down, A — left, D — right</div>

<script src="game.js"></script>
<script>
const { COLS, ROWS, SMOOTH, createState, queueDirection, step: gameStep, keyToDirection } = SnakeGame;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const overEl = document.getElementById('gameover');
const titleEl = document.getElementById('title');
const finalEl = document.getElementById('final');

const CELL = canvas.width / COLS;
const SKINS = [
  { name: 'Green',  head: '#8fd18f', body: '#5aa65a' },
  { name: 'Blue',   head: '#7fb8ff', body: '#4a86d4' },
  { name: 'Purple', head: '#c9a0ff', body: '#9566d6' },
  { name: 'Pink',   head: '#ff9ec8', body: '#d9669a' },
  { name: 'Yellow', head: '#ffe27a', body: '#d9b83a' },
  { name: 'White',  head: '#ffffff', body: '#bdbdbd' },
];
let skinIndex = 0;
try { skinIndex = parseInt(localStorage.getItem('snakeSkin'), 10) || 0; } catch (e) {}
if (skinIndex < 0 || skinIndex >= SKINS.length) skinIndex = 0;

const storage = (() => { try { return localStorage; } catch (e) { return null; } })();

function currentSpeed() {
  return SnakeGame.currentSpeed(game.score);
}

let game, prevSnake;
let acc = 0, lastTime = 0;

function start() {
  game = createState({ storage });
  prevSnake = game.snake.map(s => ({ ...s }));
  acc = 0;
  scoreEl.textContent = 'Score: 0';
  bestEl.textContent = 'Best: ' + game.best;
  overEl.style.display = 'none';
}

function step() {
  const prev = game.snake.map(s => ({ ...s }));
  const result = gameStep(game);
  if (result === 'dead') return gameOver();
  prevSnake = prev;
  if (result === 'ate' || result === 'won') {
    scoreEl.textContent = 'Score: ' + game.score;
    bestEl.textContent = 'Best: ' + game.best;
  }
  if (result === 'won') gameOver();
}

function gameOver() {
  prevSnake = game.snake.map(s => ({ ...s }));
  titleEl.textContent = game.won ? 'YOU WIN!' : 'GAME OVER';
  finalEl.textContent = 'Score: ' + game.score;
  overEl.style.display = 'flex';
}

// Claude icon: an orange "spark" made of rays
function drawClaude(cx, cy, r) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = '#d97757';
  ctx.lineCap = 'round';
  ctx.lineWidth = 2;
  const rays = 12;
  for (let i = 0; i < rays; i++) {
    const a = (Math.PI * 2 * i) / rays;
    const len = i % 2 === 0 ? r : r * 0.7;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.15, Math.sin(a) * r * 0.15);
    ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len);
    ctx.stroke();
  }
  ctx.restore();
}

// t in [0..1] — progress between the previous and the current step
function draw(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (game.food) drawClaude(game.food.x * CELL + CELL / 2, game.food.y * CELL + CELL / 2, CELL / 2 - 1);

  game.snake.forEach((s, i) => {
    const p = prevSnake[Math.min(i, prevSnake.length - 1)];
    const x = p.x + (s.x - p.x) * t;
    const y = p.y + (s.y - p.y) * t;
    ctx.fillStyle = i === 0 ? SKINS[skinIndex].head : SKINS[skinIndex].body;
    ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
  });
}

function frame(time) {
  const dt = Math.min(time - (lastTime || time), 100);
  lastTime = time;
  if (game.alive) {
    acc += dt;
    const interval = currentSpeed();
    while (game.alive && acc >= interval) {
      acc -= interval;
      step();
    }
  }
  draw(game.alive ? Math.min(acc / (currentSpeed() * SMOOTH), 1) : 1);
  requestAnimationFrame(frame);
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!game.alive) {
    if (k === ' ' || k === 'enter') start();
    return;
  }
  const d = keyToDirection(k);
  if (!d || !queueDirection(game, d)) return;
  // the snake has already finished sliding into its cell: turn right now instead of waiting for the next tick
  if (game.inputQueue.length === 1 && SnakeGame.shouldTurnNow(acc, game.score)) {
    acc = 0;
    step();
  }
});

// skin picker on the GAME OVER screen
const skinsEl = document.getElementById('skins');
SKINS.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'skin';
  b.title = s.name;
  b.style.background = `linear-gradient(135deg, ${s.head} 50%, ${s.body} 50%)`;
  b.addEventListener('click', () => {
    skinIndex = i;
    try { localStorage.setItem('snakeSkin', i); } catch (e) {}
    renderSkins();
  });
  skinsEl.appendChild(b);
});
function renderSkins() {
  [...skinsEl.children].forEach((b, i) => b.classList.toggle('selected', i === skinIndex));
}
renderSkins();

start();
requestAnimationFrame(frame);
</script>
</body>
</html>
